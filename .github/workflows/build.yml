name: Build APK from apktool decode

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install apktool
        run: sudo apt-get update && sudo apt-get install -y apktool
      - name: Build APK
        run: apktool b . -o kiwi-unsigned.apk
      - name: Cari apksigner & zipalign
        run: echo "BUILD_TOOLS=$(dirname $(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -1))" >> $GITHUB_ENV
      - name: Zipalign
        run: $BUILD_TOOLS/zipalign -v -p 4 kiwi-unsigned.apk kiwi-aligned.apk
      - name: Bikin debug keystore
        run: keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Debug,O=Debug,C=ID"
      - name: Sign APK
        run: $BUILD_TOOLS/apksigner sign --ks debug.keystore --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --out kiwi-signed.apk kiwi-aligned.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kiwi-signed-apk
          path: kiwi-signed.apk
